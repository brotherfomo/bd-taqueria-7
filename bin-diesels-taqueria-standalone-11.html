<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bin Diesel's Taqueria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=VT323&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;}
body{background:#1a0a00;overflow:hidden;font-family:'VT323',monospace;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;}
#app{width:100%;max-width:680px;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;}

/* ── BACKGROUND ── */
#bg{position:absolute;inset:0;z-index:0;}
#bg-wall{position:absolute;top:0;left:0;right:0;height:200px;background-color:#6b3a2a;background-image:repeating-linear-gradient(180deg,transparent 0px,transparent 22px,rgba(0,0,0,.3) 22px,rgba(0,0,0,.3) 24px),repeating-linear-gradient(0deg,transparent 0px,transparent 56px,rgba(0,0,0,.2) 56px,rgba(0,0,0,.2) 58px);}
#bg-counter{position:absolute;top:195px;left:0;right:0;height:52px;background:linear-gradient(180deg,#e8c87a 0%,#c8983a 35%,#a07020 70%,#7a5010 100%);border-top:4px solid #f0d888;border-bottom:5px solid #5a3808;box-shadow:0 6px 18px rgba(0,0,0,.6);}
#bg-floor{position:absolute;top:247px;left:0;right:0;bottom:0;background-color:#d4b078;background-image:repeating-linear-gradient(0deg,transparent 0px,transparent 48px,rgba(0,0,0,.12) 48px,rgba(0,0,0,.12) 50px),repeating-linear-gradient(90deg,transparent 0px,transparent 48px,rgba(0,0,0,.12) 48px,rgba(0,0,0,.12) 50px);}
#bg-deco{position:absolute;top:14px;left:0;right:0;z-index:1;pointer-events:none;}

/* ── TOPBAR ── */
#topbar{height:auto;min-height:40px;background:linear-gradient(180deg,#1a0900,#2d1100);border-bottom:3px solid #c8760a;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:4px 10px;gap:2px;flex-shrink:0;position:relative;z-index:40;box-shadow:0 3px 10px rgba(0,0,0,.7);}
.tb-stat{font-size:clamp(13px,3.5vw,18px);color:#f5c842;text-shadow:1px 1px 0 #000;white-space:nowrap;}
.tb-stat span{color:#ff9933;}
#timer-outer{width:120px;height:12px;background:#111;border:2px solid #c8760a;border-radius:6px;overflow:hidden;display:inline-block;vertical-align:middle;}
#timer-inner{height:100%;background:#44cc66;transition:width .4s linear,background .4s;border-radius:4px;}

/* ── MAIN LAYOUT ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:10;}

/* ── REGISTER PANEL ── */
#register{width:100%;flex-shrink:0;display:flex;flex-direction:row;align-items:stretch;background:linear-gradient(180deg,rgba(30,15,0,.96),rgba(50,25,5,.96));border-bottom:3px solid #8b5a1a;border-right:none;box-shadow:0 4px 12px rgba(0,0,0,.6);overflow:hidden;max-height:160px;}
#reg-header{background:linear-gradient(180deg,#1a0800,#2a1200);border-right:2px solid #c8760a;padding:8px 6px;font-size:16px;color:#f5c842;letter-spacing:1px;text-align:center;text-shadow:2px 2px 0 #000;flex-shrink:0;display:flex;align-items:center;writing-mode:vertical-rl;transform:rotate(180deg);}
#reg-machine{display:none;}
#receipt-wrap{background:#fffae8;margin:3px 6px 3px 0;border:2px solid #b8780a;border-radius:4px;flex:1;overflow:hidden;padding:5px 7px;min-height:0;box-shadow:inset 0 2px 6px rgba(0,0,0,.15);columns:2 auto;column-gap:8px;column-fill:auto;height:100%;}
.rct-title{font-size:clamp(11px,3vw,14px);font-weight:700;color:#8b2000;border-bottom:1px dashed #c8860a;margin-bottom:3px;column-span:all;}
.rct-row{font-size:clamp(10px,2.8vw,13px);color:#2d1200;margin:1px 0;}
.rct-row.main-item{font-size:clamp(12px,3.2vw,15px);color:#8b2000;font-weight:700;}
.rct-total{font-size:clamp(11px,3vw,15px);color:#8b4000;font-weight:700;border-top:1px dashed #c8860a;margin-top:3px;padding-top:2px;column-span:all;}

/* ── KITCHEN PANEL ── */
#kitchen{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;min-height:0;}
#kitchen-header{background:linear-gradient(180deg,#1a0800,#2a1200);border-bottom:2px solid #c8760a;padding:4px 8px;font-size:clamp(12px,3.5vw,17px);color:#f5c842;letter-spacing:1px;text-align:center;text-shadow:2px 2px 0 #000;flex-shrink:0;z-index:2;position:relative;}

/* ── PLATE AREA ── */
#plate-area{flex-shrink:0;height:clamp(88px,20vw,115px);background:linear-gradient(180deg,#c8983a 0%,#a07020 60%,#7a5010 100%);border-bottom:4px solid #5a3808;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 8px;position:relative;box-shadow:inset 0 4px 10px rgba(0,0,0,.3);}
#plate-area::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.18);}
#the-plate{width:clamp(140px,42vw,200px);height:clamp(64px,18vw,90px);position:relative;cursor:default;flex-shrink:0;touch-action:manipulation;}
#the-plate::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:170px;height:14px;background:radial-gradient(ellipse,rgba(0,0,0,.45) 0%,transparent 70%);border-radius:50%;}
#plate-svg{width:100%;height:100%;overflow:visible;}
#beer-mug{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}

/* ── INGREDIENT SHELVES ── */
#shelves{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px clamp(96px,calc(16vw + 16px),126px) 4px 6px;}
#shelves::-webkit-scrollbar{width:6px;}
#shelves::-webkit-scrollbar-track{background:#2a1800;}
#shelves::-webkit-scrollbar-thumb{background:#c8760a;border-radius:3px;}
.shelf{margin-bottom:6px;}
.shelf-title{font-size:clamp(13px,3.5vw,16px);color:#ffffff;letter-spacing:1px;margin-bottom:3px;border-bottom:1px solid #8b5020;padding-bottom:2px;text-shadow:1px 1px 3px #000,0 0 8px rgba(0,0,0,.8);font-weight:700;}
.shelf-items{display:flex;flex-wrap:wrap;gap:5px;}
.ing-card{position:relative;background:transparent;border:none;color:#f5c842;padding:3px 3px 4px;cursor:pointer;font-family:'VT323',monospace;text-align:center;border-radius:6px;display:inline-flex;flex-direction:column;align-items:center;gap:2px;width:clamp(62px,17vw,82px);min-height:52px;transition:transform .1s,filter .1s;text-shadow:1px 1px 2px rgba(0,0,0,.9);filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.ing-card:hover{transform:translateY(-4px) scale(1.08);filter:drop-shadow(0 6px 8px rgba(0,0,0,.6)) brightness(1.15);}
.ing-card:active{transform:translateY(1px) scale(.97);}
#app.show-hints .ing-card.needed{
  filter:drop-shadow(0 0 8px #00ff66) drop-shadow(0 0 16px #00ff66) drop-shadow(0 0 28px #00cc44) drop-shadow(0 2px 4px rgba(0,0,0,.6));
  animation:hintPulse .6s ease-in-out infinite alternate;
  position:relative;
  z-index:5;
}
@keyframes hintPulse{
  0%{filter:drop-shadow(0 0 6px #00ff66) drop-shadow(0 0 14px #00ff44) drop-shadow(0 0 24px #00aa33) drop-shadow(0 2px 4px rgba(0,0,0,.6));}
  100%{filter:drop-shadow(0 0 12px #44ffaa) drop-shadow(0 0 24px #00ff66) drop-shadow(0 0 40px #00ee55) drop-shadow(0 2px 4px rgba(0,0,0,.6));}
}
.ing-card.done{opacity:.45;cursor:not-allowed;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3)) grayscale(.4);}
.ing-card svg{display:block;}
.ing-card .ic-name{font-size:clamp(11px,3vw,14px);line-height:1.2;color:#ffffff;font-weight:700;text-shadow:1px 1px 3px #000,0 0 8px rgba(0,0,0,.8);}
.plate-chip{display:inline-flex;align-items:center;gap:3px;background:rgba(0,0,0,.35);padding:4px 7px 4px 3px;border-radius:10px;cursor:pointer;transition:background .1s;min-height:28px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.plate-chip:hover{background:rgba(200,50,50,.5);}
.plate-chip svg{display:block;}
.plate-chip span{font-size:9px;color:#fff;font-family:'VT323',monospace;line-height:1;}

/* ── SERVE BUTTON ── */
#btn-serve{background:linear-gradient(180deg,#cc1111,#881010);color:#ffe0e0;border:3px solid #ff5555;padding:8px 18px;font-size:clamp(15px,4vw,20px);cursor:pointer;font-family:'VT323',monospace;letter-spacing:2px;border-radius:4px;text-shadow:1px 1px 0 #000;box-shadow:0 3px 0 #440000;min-height:44px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
#btn-serve:hover:not(:disabled){background:linear-gradient(180deg,#ee2222,#cc1111);}
#btn-serve:active:not(:disabled){background:linear-gradient(180deg,#ff3333,#ee2222);transform:scale(.97);}
#btn-serve:disabled{background:linear-gradient(180deg,#2a2a2a,#1a1a1a);border-color:#444;color:#555;cursor:not-allowed;box-shadow:none;}

/* ── BIN DIESEL ── */
#bd-wrap{position:absolute;bottom:4px;right:6px;width:clamp(80px,16vw,110px);height:clamp(100px,20vw,138px);pointer-events:none;z-index:50;filter:drop-shadow(4px 10px 12px rgba(0,0,0,.85));}
#bd-bubble{position:absolute;bottom:142px;right:0;background:#fffae8;border:2px solid #c8860a;border-radius:8px;padding:5px 9px;font-size:13px;color:#2d1200;font-family:'VT323',monospace;display:none;max-width:155px;white-space:normal;text-align:center;box-shadow:2px 3px 8px rgba(0,0,0,.5);z-index:60;}
#bd-bubble::after{content:'';position:absolute;bottom:-10px;right:16px;border:5px solid transparent;border-top-color:#c8860a;}
@keyframes bdIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes bdHappy{0%{transform:rotate(-10deg) scale(1.05)}50%{transform:rotate(10deg) scale(1.05)}100%{transform:rotate(0) scale(1)}}
@keyframes bdAngry{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes eyeP{0%,100%{opacity:1}50%{opacity:.35}}
#bd-svg{animation:bdIdle 2.5s ease-in-out infinite;}
@keyframes bdExplode{0%{transform:scale(1) rotate(0deg);opacity:1}15%{transform:scale(1.8) rotate(-20deg);opacity:1}40%{transform:scale(1.5) rotate(25deg);opacity:.9}70%{transform:scale(0.6) rotate(-30deg);opacity:.5}100%{transform:scale(0) rotate(60deg);opacity:0}}
@keyframes explodeParticle{0%{transform:translate(0,0) scale(1.2);opacity:1}15%{opacity:1}80%{opacity:.6}100%{transform:translate(var(--dx),var(--dy)) scale(0) rotate(var(--rot,0deg));opacity:0}}
#explosion-layer{position:absolute;inset:0;pointer-events:none;z-index:80;overflow:hidden;}
.expart{position:absolute;width:12px;height:12px;border-radius:50%;animation:explodeParticle .8s ease-out forwards;}
@keyframes fireball{0%{transform:scale(0);opacity:1}30%{transform:scale(1);opacity:.9}70%{transform:scale(1.4);opacity:.5}100%{transform:scale(2.2);opacity:0}}
@keyframes shockwave{0%{transform:scale(0);opacity:.8}100%{transform:scale(3);opacity:0}}
.exfireball{position:absolute;border-radius:50%;animation:fireball .7s ease-out forwards;pointer-events:none;}
.exshock{position:absolute;border-radius:50%;border:4px solid #ff8800;animation:shockwave .5s ease-out forwards;pointer-events:none;}
@keyframes screenFlash{0%,100%{opacity:0}50%{opacity:.35}}
.ex-screen-flash{position:absolute;inset:0;background:radial-gradient(ellipse at center,#ffcc00,#ff4400);pointer-events:none;animation:screenFlash .35s ease-out forwards;z-index:79;}
#mute-btn{float:right;margin:-3px -4px 4px 8px;background:#fffae8;border:1.5px solid #c8860a;color:#8b4000;font-family:'VT323',monospace;font-size:13px;padding:3px 8px;cursor:pointer;border-radius:3px;min-height:28px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.15);column-span:all;}
@keyframes toastPop{0%{transform:translateY(0) scale(.8);opacity:0}20%{transform:translateY(-8px) scale(1.1);opacity:1}80%{transform:translateY(-16px) scale(1);opacity:1}100%{transform:translateY(-28px) scale(.9);opacity:0}}
.freebie-toast{position:absolute;background:#ff2266;color:#fff;font-family:'VT323',monospace;font-size:16px;font-weight:700;padding:4px 10px;border-radius:4px;pointer-events:none;z-index:90;white-space:nowrap;animation:toastPop .9s ease forwards;}


/* ── OVERLAY ── */
#overlay{position:absolute;inset:0;background:rgba(8,3,0,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:20px;text-align:center;overflow-y:auto;}
#overlay.hidden{display:none;}
.ov-big{font-family:'Permanent Marker',cursive;font-size:clamp(30px,9vw,44px);color:#ff8c1a;text-shadow:4px 4px 0 #7a3000;line-height:1.1;}
.ov-sub{font-size:20px;color:#f5c842;margin:4px 0 10px;font-family:'VT323',monospace;}
.ov-btn{background:linear-gradient(180deg,#ff8c1a,#c85e00);color:#1a0500;border:3px solid #f5c842;padding:12px 28px;font-size:clamp(17px,5vw,22px);cursor:pointer;font-family:'VT323',monospace;letter-spacing:2px;margin:5px;border-radius:4px;box-shadow:0 4px 0 #5a2000;min-height:48px;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.ov-btn:hover{background:linear-gradient(180deg,#ffaa33,#ff8c1a);}
.ov-btn.sec{background:linear-gradient(180deg,#3a3a3a,#1a1a1a);border-color:#777;color:#ccc;box-shadow:0 4px 0 #080808;}
.ov-btn.sec:hover{background:linear-gradient(180deg,#555,#333);}
.ob-wrap{background:#2d1200;border:2px solid #7a4010;padding:11px 16px;margin:8px 0;text-align:left;min-width:230px;border-radius:6px;}
.ob-row{display:flex;justify-content:space-between;font-size:16px;color:#f5c842;margin:3px 0;font-family:'VT323',monospace;}
.ob-row.tot{border-top:1px solid #ff8c1a;padding-top:4px;font-size:17px;color:#ff8c1a;}
.res-head{font-size:clamp(28px,8vw,40px);font-weight:900;margin-bottom:4px;font-family:'VT323',monospace;}
.res-head.win{color:#44dd77;text-shadow:3px 3px 0 #115522;}
.res-head.lose{color:#ff4444;text-shadow:3px 3px 0 #881111;}
.res-amt{font-size:clamp(36px,10vw,52px);color:#f5c842;text-shadow:3px 3px 0 #7a5000;margin-bottom:4px;font-family:'VT323',monospace;}
.ov-msg{font-size:15px;color:#c8a060;margin:5px 0 10px;line-height:1.6;font-family:'VT323',monospace;}
</style>
</head>
<body>
<div id="app">

<!-- BACKGROUND -->
<div id="bg">
  <div id="bg-wall"></div>
  <div id="bg-counter"></div>
  <div id="bg-floor"></div>
  <svg id="bg-deco" viewBox="0 0 680 80" width="100%" height="80" style="position:absolute;top:14px;left:0;">
    <line x1="60" y1="0" x2="60" y2="22" stroke="#333" stroke-width="2"/>
    <ellipse cx="60" cy="34" rx="18" ry="12" fill="#444" stroke="#222" stroke-width="2"/>
    <rect x="42" y="22" width="36" height="16" rx="4" fill="#555" stroke="#333" stroke-width="1.5"/>
    <rect x="55" y="18" width="10" height="6" rx="3" fill="#333"/>
    <line x1="180" y1="0" x2="180" y2="18" stroke="#333" stroke-width="2"/>
    <ellipse cx="180" cy="26" rx="22" ry="8" fill="#666" stroke="#333" stroke-width="2"/>
    <rect x="158" y="20" width="44" height="14" rx="3" fill="#777" stroke="#444" stroke-width="1.5"/>
    <rect x="202" y="23" width="28" height="4" rx="2" fill="#555"/>
    <rect x="280" y="8" width="120" height="52" rx="4" fill="#5a3a1a" stroke="#3a2010" stroke-width="2"/>
    <rect x="283" y="11" width="114" height="46" rx="3" fill="#4a3010"/>
    <rect x="286" y="14" width="22" height="38" rx="3" fill="#8b6a3a" stroke="#6a4a1a" stroke-width="1"/>
    <rect x="312" y="14" width="22" height="38" rx="3" fill="#c88040" stroke="#8b5a1a" stroke-width="1"/>
    <rect x="338" y="14" width="22" height="38" rx="3" fill="#8b4a2a" stroke="#6a3010" stroke-width="1"/>
    <rect x="364" y="14" width="22" height="38" rx="3" fill="#4a7a30" stroke="#2a5010" stroke-width="1"/>
    <text x="297" y="37" text-anchor="middle" font-size="7" fill="#ffe0a0" font-family="VT323,monospace">SALT</text>
    <text x="323" y="37" text-anchor="middle" font-size="7" fill="#ffe0a0" font-family="VT323,monospace">CHILI</text>
    <text x="349" y="37" text-anchor="middle" font-size="7" fill="#ffe0a0" font-family="VT323,monospace">CUMIN</text>
    <text x="375" y="37" text-anchor="middle" font-size="7" fill="#ffe0a0" font-family="VT323,monospace">HERB</text>
    <line x1="520" y1="0" x2="520" y2="18" stroke="#333" stroke-width="2"/>
    <ellipse cx="520" cy="26" rx="22" ry="8" fill="#555" stroke="#333" stroke-width="2"/>
    <rect x="498" y="20" width="44" height="14" rx="3" fill="#666" stroke="#444" stroke-width="1.5"/>
    <rect x="470" y="23" width="28" height="4" rx="2" fill="#555"/>
    <line x1="630" y1="0" x2="630" y2="22" stroke="#333" stroke-width="2"/>
    <ellipse cx="630" cy="34" rx="18" ry="12" fill="#444" stroke="#222" stroke-width="2"/>
    <rect x="612" y="22" width="36" height="16" rx="4" fill="#555" stroke="#333" stroke-width="1.5"/>
    <rect x="625" y="18" width="10" height="6" rx="3" fill="#333"/>
  </svg>
</div>

<!-- TOPBAR -->
<div id="topbar">
  <div class="tb-stat">&#36;<span id="tb-money">0.00</span></div>
  <div class="tb-stat" style="display:flex;align-items:center;gap:7px;">
    &#9201;
    <div id="timer-outer"><div id="timer-inner" style="width:100%"></div></div>
    <span id="tb-time">--</span>
  </div>
  <div class="tb-stat">ORDER <span id="tb-order">--</span></div>
  <div class="tb-stat">PAY: <span id="tb-pay">$0.00</span></div>
</div>

<!-- MAIN -->
<div id="main">

  <!-- REGISTER -->
  <div id="register">
    <div id="reg-header">REGISTER</div>
    <div id="reg-machine">
      <svg viewBox="0 0 160 100" width="148" height="92">
        <defs>
          <linearGradient id="rg-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#606060"/><stop offset="100%" stop-color="#282828"/></linearGradient>
          <linearGradient id="rg-top" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#383838"/><stop offset="100%" stop-color="#181818"/></linearGradient>
          <linearGradient id="rg-screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#003800"/><stop offset="100%" stop-color="#001800"/></linearGradient>
        </defs>
        <rect x="5" y="68" width="150" height="28" rx="6" fill="url(#rg-body)" stroke="#888" stroke-width="1.5"/>
        <rect x="5" y="74" width="150" height="16" fill="#222" stroke="#555" stroke-width="1"/>
        <rect x="55" y="77" width="50" height="9" rx="4" fill="#333" stroke="#666" stroke-width="1"/>
        <circle cx="80" cy="82" r="3.5" fill="#999" stroke="#bbb" stroke-width="1"/>
        <rect x="8" y="26" width="144" height="46" rx="7" fill="url(#rg-body)" stroke="#777" stroke-width="1.5"/>
        <rect x="8" y="26" width="144" height="4" rx="2" fill="rgba(255,255,255,.12)"/>
        <rect x="16" y="10" width="128" height="24" rx="5" fill="url(#rg-top)" stroke="#555" stroke-width="1.5"/>
        <rect x="20" y="13" width="120" height="18" rx="3" fill="url(#rg-screen)"/>
        <rect x="22" y="14" width="36" height="5" rx="2" fill="rgba(255,255,255,.07)"/>
        <text x="80" y="25.5" text-anchor="middle" font-size="11" fill="#00ff88" font-family="VT323,monospace" id="reg-screen-txt">READY</text>
        <rect x="16" y="36" width="13" height="8" rx="2" fill="#e07818"/>
        <rect x="32" y="36" width="13" height="8" rx="2" fill="#e07818"/>
        <rect x="48" y="36" width="13" height="8" rx="2" fill="#e07818"/>
        <rect x="64" y="36" width="13" height="8" rx="2" fill="#e07818"/>
        <rect x="80" y="36" width="13" height="8" rx="2" fill="#e07818"/>
        <rect x="96" y="36" width="13" height="8" rx="2" fill="#aa1111"/>
        <rect x="16" y="50" width="13" height="8" rx="2" fill="#444"/>
        <rect x="32" y="50" width="13" height="8" rx="2" fill="#444"/>
        <rect x="48" y="50" width="13" height="8" rx="2" fill="#444"/>
        <rect x="64" y="50" width="13" height="8" rx="2" fill="#444"/>
        <rect x="80" y="50" width="32" height="8" rx="2" fill="#116633"/>
        <rect x="55" y="68" width="50" height="4" rx="2" fill="#111"/>
        <rect x="10" y="26" width="140" height="3" rx="1" fill="rgba(255,255,255,.1)"/>
      </svg>
    </div>
    <div id="receipt-wrap">
      <button id="mute-btn" onclick="toggleMute()">♪ ON</button>
      <div class="rct-title" id="rct-cust">Waiting...</div>

// ─── UTILS ──────────────────────────────────────────────────────
function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function itemById(id) { return ALL_ITEMS.find(x => x.id === id); }

/**
 * Safe money formatter — never displays NaN.
 * @param {number} n
 * @returns {string} e.g. "4.75"
 */
function money(n) {
  const v = parseFloat(n);
  return isNaN(v) ? '0.00' : Math.max(0, v).toFixed(2);
}

// ─── PAYOUT ─────────────────────────────────────────────────────
/**
 * Calculate how much the player earns for the current order.
 *
 * timeLeft > 10 → full price (countdown not yet active)
 * 0 ≤ timeLeft ≤ 10 → linearly drains from full price → $0
 * timeLeft < 0  → $0 (auto-explode handles this)
 */
function computePayout() {
  const o = G.currentOrder;
  if (!o) return 0;
  const total = parseFloat(o.totalPrice);
  // Full price while more than 10 seconds remain
  if (G.timeLeft > 10) return total;
  // Below 10s: linearly drain from full price to $0 over those 10 seconds
  // timeLeft=10 -> full price, timeLeft=0 -> $0, timeLeft<0 -> $0
  const t = Math.max(0, G.timeLeft);
  return parseFloat(((t / 10) * total).toFixed(2));
}

function startGame() {

function genOrder() {
  // Difficulty escalates quickly:
  //   order 1:    taco only, 1 addon
  //   orders 2-3: simple mains, 1-2 addons, single main
  //   orders 4-5: any main, 2-3 addons, chance of combo order
  //   orders 6-9: complex mains weighted, 3-4 addons, combo more likely
  //   orders 10+: hardest mains, 4-5 addons, combo orders common
  const n = G.orderNum;

  // Addon count ramps fast
  let minAdd, maxAdd;
  if      (n === 1) { minAdd = 1; maxAdd = 1; }
  else if (n <= 3)  { minAdd = 1; maxAdd = 2; }
  else if (n <= 5)  { minAdd = 2; maxAdd = 3; }
  else if (n <= 9)  { minAdd = 3; maxAdd = 4; }
  else              { minAdd = 4; maxAdd = 5; }
  const numAddons = minAdd + Math.floor(Math.random() * (maxAdd - minAdd + 1));

  // Main item pool — harder items appear sooner
  let mainPool;
  if      (n === 1) mainPool = MAINS.filter(m => m.id === 'taco');
  else if (n <= 3)  mainPool = MAINS.filter(m => ['taco','bowl','nachos'].includes(m.id));
  else if (n <= 5)  mainPool = MAINS;
  else              mainPool = [...MAINS, ...MAINS.filter(m => m.price >= 6.00)]; // weight harder
  const main = rand(mainPool);

  const proteinItems = SHELVES.find(s => s.title === 'PROTEIN').items;
  const baseItems    = SHELVES.find(s => s.title === 'BASE / WRAP').items;
  const protein      = rand(proteinItems);
  const base         = main.needsBase ? rand(baseItems) : null;

  // Combo order: a second main item added to the order from order 4 onward
  // Probability: 0% orders 1-3, 30% orders 4-5, 50% orders 6-9, 70% orders 10+
  let comboChance = n <= 3 ? 0 : n <= 5 ? 0.3 : n <= 9 ? 0.5 : 0.7;
  let secondMain = null;
  let secondBase = null;
  if (Math.random() < comboChance) {
    const comboPool = MAINS.filter(m => m.id !== main.id || main.id === 'taco' || main.id === 'burrito');
    secondMain = rand(comboPool);
    secondBase = secondMain.needsBase ? rand(baseItems) : null;
  }

  const lockedIds = new Set(
    [protein.id, base ? base.id : null,
     ...(main.extraRequired || []),
     ...(secondMain ? (secondMain.extraRequired || []) : []),
     secondBase ? secondBase.id : null
    ].filter(Boolean)
  );
  const avail  = ADDON_POOL.filter(a => !lockedIds.has(a.id));
  const shuffled = [...avail].sort(() => Math.random() - 0.5);
  const addons = shuffled.slice(0, Math.min(numAddons, shuffled.length));

  const customer   = rand(CUSTOMERS);
  const addonPrice = addons.reduce((a, x) => a + x.price, 0);
  const comboPrice = secondMain ? secondMain.price : 0;
  const totalPrice = parseFloat((main.price + comboPrice + addonPrice).toFixed(2));

  // Timer tightens as orders progress
  const timeLimit = n >= 30 ? 15 : n >= 20 ? 20 : n >= 10 ? 25 : 30;

  return { main, protein, base, addons, customer, totalPrice, timeLimit, secondMain, secondBase };
}

function beginOrder() {
  const o = genOrder();
  G.currentOrder = o;
  G.orderNum++;
  G.plateIds = [];
  G.needed   = [];

  // Build required ingredient list
  if (o.base) G.needed.push(o.base.id);
  G.needed.push(o.protein.id);
  (o.main.extraRequired || []).forEach(id => { if (!G.needed.includes(id)) G.needed.push(id); });
  // Combo second main
  if (o.secondMain) {
    if (o.secondBase && !G.needed.includes(o.secondBase.id)) G.needed.push(o.secondBase.id);
    (o.secondMain.extraRequired || []).forEach(id => { if (!G.needed.includes(id)) G.needed.push(id); });
  }
  o.addons.forEach(a => { if (!G.needed.includes(a.id)) G.needed.push(a.id); });

  G.phase = 'kitchen';
  document.getElementById('app').classList.remove('show-hints');

  updateHUD();
  renderReceipt();
  renderShelves();
  renderPlate();

  document.getElementById('kitchen-header').textContent = 'KITCHEN — click or drag ingredients onto the plate';
  document.getElementById('btn-serve').disabled      = true;
  document.getElementById('reg-screen-txt').textContent = '$' + money(o.totalPrice);
  // Kitchen is open immediately — no confirm step

  startTimer(o.timeLimit);
  startMusic();
  bdSay('start');
  bdAnim('idle');
}

function renderReceipt() {
  const o = G.currentOrder;
  document.getElementById('rct-cust').textContent = `${o.customer.name}: ${o.customer.say}...`;

  let html = `<div class="rct-row main-item">${o.main.name} — $${money(o.main.price)}</div>`;
  if (o.base) html += `<div class="rct-row">&nbsp;• ${o.base.name}</div>`;
  html += `<div class="rct-row">&nbsp;• ${o.protein.name}</div>`;

  (o.main.extraRequired || []).forEach(id => {

// ─── SHELVES ────────────────────────────────────────────────────
function renderShelves() {
  const container = document.getElementById('shelves');

  container.innerHTML = SHELVES.map(shelf => `
    <div class="shelf">
      <div class="shelf-title">${shelf.title}</div>
      <div class="shelf-items">
        ${shelf.items.map(item => `
          <div class="ing-card" id="ic-${item.id}" data-id="${item.id}" draggable="true">
            ${ICONS[item.svgKey] || ''}
            <span class="ic-name">${item.name}</span>
          </div>`).join('')}
      </div>
    </div>`).join('');

  // Attach events once — shelves are only re-rendered at the start of each order
  container.querySelectorAll('.ing-card').forEach(card => {
    const id = card.dataset.id;

    card.addEventListener('dragstart', e => {
      if (G.plateIds.includes(id)) { e.preventDefault(); return; }
      G.dragId = id;
      e.dataTransfer.effectAllowed = 'copy';
      e.dataTransfer.setData('text/plain', id);
      card.style.opacity = '.4';
    });

    card.addEventListener('dragend', () => {
      card.style.opacity = '';
      G.dragId = null;
    });

    card.addEventListener('click', () => {
      if (G.phase !== 'kitchen') return;
      addToPlate(id);
    });
    card.addEventListener('touchend', (e) => {
      e.preventDefault();
      if (G.phase !== 'kitchen') return;
      addToPlate(id);
    }, {passive:false});
  });

  refreshShelfClasses();
}

/** Update .needed / .done classes without rebuilding DOM or losing listeners */
function refreshShelfClasses() {
  ALL_ITEMS.forEach(item => {
    const card = document.getElementById('ic-' + item.id);
    if (!card) return;
    const isNeeded  = G.needed.includes(item.id);
    const isOnPlate = G.plateIds.includes(item.id);
    card.classList.toggle('needed', isNeeded && !isOnPlate);
    card.classList.toggle('done',   isOnPlate);
    card.draggable    = !isOnPlate;
    card.style.cursor = isOnPlate ? 'default' : 'grab';
  });
}

// ─── PLATE DROP ZONE (set up once) ──────────────────────────────
(function setupTrayDrop() {
  const plate = document.getElementById('the-plate');

  plate.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
    document.getElementById('plate-svg').style.filter = 'drop-shadow(0 0 8px rgba(68,221,119,.8))';
  });

  plate.addEventListener('dragleave', e => {
    if (!plate.contains(e.relatedTarget))
      document.getElementById('plate-svg').style.filter = '';
  });

  plate.addEventListener('drop', e => {
    e.preventDefault();
    document.getElementById('plate-svg').style.filter = '';
    const id = e.dataTransfer.getData('text/plain') || G.dragId;
    if (id) addToPlate(id);
    G.dragId = null;
  });
})();

function renderPlate() {
  const area = document.getElementById('plate-items');
  const hint = document.getElementById('plate-drop-hint');
  const prog = document.getElementById('build-progress');

  if (G.plateIds.length === 0) {
    area.innerHTML   = '';
    hint.textContent = G.phase === 'kitchen' ? 'Drop here' : '';
    prog.textContent = '';
    document.getElementById('btn-serve').disabled = true;
    return;
  }

  hint.textContent = '';
  area.innerHTML = G.plateIds.map(id => {
    const item = itemById(id);
    if (!item) return '';
    return `<span class="plate-chip" title="Remove ${item.name}" onclick="removeFromPlate('${id}')">
      ${iconSm(item.svgKey || item.id)}
      <span>${item.name}</span>
    </span>`;
  }).join('');

  const matched  = G.needed.filter(nid => G.plateIds.includes(nid));
  prog.textContent = `${matched.length} / ${G.needed.length} items`;
  prog.style.color = matched.length === G.needed.length ? '#44dd77' : '#f5c842';

  const complete = matched.length === G.needed.length;
  document.getElementById('btn-serve').disabled = !complete || G.phase !== 'kitchen';

  if (complete) { bdSay('done'); bdAnim('happy'); }
}

function addToPlate(id) {
  if (!id || G.phase !== 'kitchen' || G.plateIds.includes(id)) return;
  const item = itemById(id);
  if (!item) return;
  G.plateIds.push(id);
  renderPlate();
  refreshShelfClasses();
  if (G.needed.includes(id)) bdSay('cooking');
}

function removeFromPlate(id) {
  G.plateIds = G.plateIds.filter(x => x !== id);
  renderPlate();
  refreshShelfClasses();
}

// Returns list of extra ingredients on the plate that weren't ordered
function getExtras() {
  return G.plateIds.filter(id => !G.needed.includes(id));
}

// Total cost of freebies given away
function computeFrebiePenalty() {
  return getExtras().reduce((sum, id) => {
    return sum + (INGREDIENT_PRICES[id] || 0);
  }, 0);
}

function serveOrder() {
  clearInterval(G.timerInt);
  const payout  = computePayout();
  const freePen = parseFloat(computeFrebiePenalty().toFixed(2));
  const final   = parseFloat(Math.max(0, payout - freePen).toFixed(2));
  G.money = parseFloat((G.money + final).toFixed(2));
  updateHUD();
  showResult(payout, freePen, final);
}

// ─── AUDIO ENGINE ──────────────────────────────────────────────
let audioCtx = null;
let musicNodes = [];
let musicPlaying = false;
let muted = false;
let currentPattern = 0;
let musicTimeout = null;

function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(freq, startTime, dur, type='square', vol=0.08, slide=0) {
  if (muted) return;
  const ctx = getCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, startTime);
  if (slide) osc.frequency.linearRampToValueAtTime(slide, startTime + dur);
  gain.gain.setValueAtTime(vol, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + dur);
  osc.start(startTime);
  osc.stop(startTime + dur + 0.01);
  musicNodes.push(osc);
}

// Chiptune background music — loop of two 8-bar patterns
const BPM = 160;
const BEAT = 60 / BPM;
const S = BEAT / 2; // sixteenth

// Chiptune taco-shop theme — Tex-Mex minor pentatonic, NOT Mario
// A minor pentatonic: A(220/440/880) C(262/523) D(294/587) E(330/659) G(392/784)
const MELODY_A = [
  [440,S],[0,S],[440,S],[523,S],[0,S],[587,S],[440,S],[0,S],
  [523,S*1.5],[440,S*0.5],[392,S],[0,S],[330,S],[392,S],[440,S*2],
  [587,S],[0,S],[587,S],[659,S],[0,S],[587,S],[523,S],[0,S],
  [440,S*1.5],[523,S*0.5],[440,S],[0,S],[392,S],[0,S*2],[330,S],
  [392,S],[440,S],[523,S],[587,S],[0,S],[523,S],[440,S],[0,S],
  [330,S],[392,S],[440,S],[0,S],[523,S],[440,S*1.5],[392,S*0.5],[330,S*2]
];
const MELODY_B = [
  [659,S],[0,S],[659,S],[0,S],[587,S],[523,S],[587,S],[0,S],
  [659,S*1.5],[587,S*0.5],[523,S],[0,S],[440,S],[0,S*2],[392,S],
  [523,S],[440,S],[0,S],[392,S],[440,S],[0,S],[523,S],[587,S],
  [440,S*2],[0,S*2],[330,S],[392,S],[440,S*2],
  [587,S],[659,S],[784,S],[0,S],[659,S],[587,S],[523,S],[0,S],
  [440,S*1.5],[392,S*0.5],[330,S],[0,S],[392,S],[440,S*3]
];
// Chunky bass — driving clave-style rhythm
const BASS_A = [
  [110,S*1.5],[0,S*0.5],[110,S],[0,S],[165,S],[0,S],[110,S],[0,S],
  [131,S*1.5],[0,S*0.5],[131,S],[0,S],[196,S],[0,S],[131,S],[0,S],
  [147,S*1.5],[0,S*0.5],[147,S],[0,S],[220,S],[0,S],[147,S],[0,S],
  [165,S*1.5],[0,S*0.5],[165,S],[0,S],[247,S],[0,S],[165,S],[0,S],
];
const BASS_B = [
  [131,S*1.5],[0,S*0.5],[131,S],[0,S],[196,S],[0,S],[131,S],[0,S],
  [110,S*1.5],[0,S*0.5],[110,S],[0,S],[165,S],[0,S],[110,S],[0,S],
  [165,S*1.5],[0,S*0.5],[165,S],[0,S],[247,S],[0,S],[165,S],[0,S],
  [147,S*1.5],[0,S*0.5],[196,S],[0,S],[220,S],[0,S],[196,S],[0,S],
];

function playPercussion(type, time) {
  if (muted) return;
  const ctx = getCtx();
  const buf = ctx.createBuffer(1, ctx.sampleRate * 0.1, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const gain = ctx.createGain();
  const filt = ctx.createBiquadFilter();
  src.connect(filt); filt.connect(gain); gain.connect(ctx.destination);
  if (type === 'kick') {
    filt.type = 'lowpass'; filt.frequency.value = 200;
    gain.gain.setValueAtTime(0.28, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.12);
  } else {
    filt.type = 'highpass'; filt.frequency.value = 3000;
    gain.gain.setValueAtTime(0.12, time);
    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.06);
  }
  src.start(time);
  src.stop(time + 0.15);
}

function schedulePattern(pattern, startTime) {
  const mel = pattern === 0 ? MELODY_A : MELODY_B;
  const bas = pattern === 0 ? BASS_A   : BASS_B;
  let t = startTime;
  mel.forEach(([f, d]) => {
    if (f > 0) playTone(f, t, d * 0.85, 'square', 0.07);
    t += d;
  });
  t = startTime;
  bas.forEach(([f, d]) => {
    if (f > 0) playTone(f, t, d * 0.9, 'triangle', 0.09);
    t += d;
  });
  // Percussion grid — kick on beats 1&3, snare on 2&4
  const beatLen = 60 / BPM;
  const totalLen = mel.reduce((a,[,d])=>a+d, 0);
  const numBeats = Math.round(totalLen / beatLen);
  for (let b = 0; b < numBeats; b++) {
    const bt = startTime + b * beatLen;
    if (b % 4 === 0 || b % 4 === 2) playPercussion('kick', bt);
    else playPercussion('snare', bt);
  }
  return totalLen;
}

function startMusic() {
  if (musicPlaying || muted) return;
  musicPlaying = true;
  function loop() {
    if (!musicPlaying) return;
    const ctx = getCtx();
    const len = schedulePattern(currentPattern, ctx.currentTime);
    currentPattern = 1 - currentPattern;
    musicTimeout = setTimeout(loop, (len - 0.05) * 1000);
  }
  loop();
}

function stopMusic() {
  musicPlaying = false;
  clearTimeout(musicTimeout);
  musicNodes.forEach(n => { try { n.stop(); } catch(e){} });
  musicNodes = [];
}

function toggleMute() {
  muted = !muted;
  document.getElementById('mute-btn').textContent = muted ? '♪ OFF' : '♪ ON';
  if (muted) stopMusic();
  else if (G.phase === 'kitchen' || G.phase === 'register') startMusic();
}

function sfxExplode() {
  if (muted) return;
  const ctx = getCtx(), t = ctx.currentTime;
  // noise burst via fast detuned oscillators
  [80,60,45,35,55].forEach((f,i) => {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(f + Math.random()*30, t);
    o.frequency.exponentialRampToValueAtTime(20, t + 0.6);
    g.gain.setValueAtTime(0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
    o.start(t + i*0.03);
    o.stop(t + 0.7);
  });
}

function sfxWin() {
  if (muted) return;
  const ctx = getCtx(), t = ctx.currentTime;
  [523,659,784,659,784,1047].forEach((f,i) => playTone(f, t+i*0.1, 0.12, 'square', 0.08));
}

// ─── EXPLOSION ANIMATION ───────────────────────────────────────
function triggerExplosion(onDone) {
  stopMusic();
  sfxExplode();
  const bd    = document.getElementById('bd-wrap');
  const layer = document.getElementById('explosion-layer');
  const rect  = bd.getBoundingClientRect();
  const wrap  = document.getElementById('app').getBoundingClientRect();
  const cx = rect.left - wrap.left + rect.width / 2;
  const cy = rect.top  - wrap.top  + rect.height / 2;

  // ── Phase 1: violent shake (20 frames, bigger amplitude) ──
  bd.style.transition = 'none';
  let shakeCount = 0;
  let shakeAmp = 8;
  const shakeInt = setInterval(() => {
    shakeAmp = Math.min(shakeAmp + 2, 32); // ramp up shake
    const dx = (Math.random()-0.5) * shakeAmp;
    const dy = (Math.random()-0.5) * shakeAmp;
    const rot = (Math.random()-0.5) * 12;
    bd.style.transform = `translate(${dx}px,${dy}px) rotate(${rot}deg)`;
    // Eyes flash red while shaking
    if (shakeCount % 3 === 0) {
      document.getElementById('eye-l').setAttribute('fill','#ff0000');
      document.getElementById('eye-r').setAttribute('fill','#ff0000');
    } else {
      document.getElementById('eye-l').setAttribute('fill','#ffff00');
      document.getElementById('eye-r').setAttribute('fill','#ffff00');
    }
    // Play sfx bursts during shake
    if (shakeCount % 4 === 0) sfxExplode();

    if (++shakeCount >= 18) {
      clearInterval(shakeInt);

      // ── Phase 2: screen flash ──
      const flash = document.createElement('div');
      flash.className = 'ex-screen-flash';
      layer.appendChild(flash);

      // Shockwave ring
      const shock = document.createElement('div');
      shock.className = 'exshock';
      shock.style.cssText = `left:${cx-60}px;top:${cy-60}px;width:120px;height:120px;`;
      layer.appendChild(shock);

      // ── Phase 3: BD explode animation ──
      bd.style.filter = 'brightness(20) saturate(0)';
      setTimeout(() => {
        document.getElementById('bd-svg').style.animation = 'bdExplode 0.9s ease-in forwards';
        bd.style.filter = 'brightness(1) drop-shadow(0 0 30px #ff4400)';

        // Central fireball
        const fb = document.createElement('div');
        fb.className = 'exfireball';
        fb.style.cssText = `
          left:${cx-50}px; top:${cy-50}px;
          width:100px; height:100px;
          background:radial-gradient(circle,#ffffff 0%,#ffee00 25%,#ff6600 55%,#cc2200 80%,transparent 100%);
          animation-duration:.65s;
        `;
        layer.appendChild(fb);

        // Second bigger fireball (delayed)
        setTimeout(() => {
          const fb2 = document.createElement('div');
          fb2.className = 'exfireball';
          fb2.style.cssText = `
            left:${cx-80}px; top:${cy-80}px;
            width:160px; height:160px;
            background:radial-gradient(circle,#ffcc00 0%,#ff6600 40%,#cc2200 70%,transparent 100%);
            animation-duration:.8s;
          `;
          layer.appendChild(fb2);
        }, 80);

        // Second shockwave
        setTimeout(() => {
          const shock2 = document.createElement('div');
          shock2.className = 'exshock';
          shock2.style.cssText = `left:${cx-80}px;top:${cy-80}px;width:160px;height:160px;border-color:#ffcc00;animation-duration:.7s;`;
          layer.appendChild(shock2);
        }, 120);

        // ── Particles: 60 fire sparks ──
        const fireColors = ['#ff0000','#ff4400','#ff8800','#ffcc00','#ffffff','#ffaa00','#ff3300','#ff6600'];
        for (let i = 0; i < 60; i++) {
          const p = document.createElement('div');
          p.className = 'expart';
          const angle = (i / 60) * Math.PI * 2 + Math.random() * 0.3;
          const dist  = 80 + Math.random() * 180;
          const size  = 6 + Math.random() * 18;
          const rot   = Math.random() * 360;
          p.style.cssText = `
            left:${cx - size/2}px; top:${cy - size/2}px;
            width:${size}px; height:${size}px;
            border-radius:${Math.random() > 0.4 ? '50%' : '2px'};
            background:${fireColors[Math.floor(Math.random()*fireColors.length)]};
            --dx:${Math.cos(angle)*dist}px;
            --dy:${Math.sin(angle)*dist - 60}px;
            --rot:${rot}deg;
            animation-duration:${0.7 + Math.random()*0.7}s;
            animation-delay:${Math.random()*0.15}s;
          `;
          layer.appendChild(p);
        }

        // ── Debris: metal chunks ──
        for (let i = 0; i < 20; i++) {
          const p = document.createElement('div');
          p.className = 'expart';
          const angle = Math.random() * Math.PI * 2;
          const dist  = 60 + Math.random() * 200;
          const size  = 4 + Math.random() * 8;
          p.style.cssText = `
            left:${cx - size/2}px; top:${cy - size/2}px;
            width:${size}px; height:${size}px;
            border-radius:1px;
            background:${Math.random()>0.5?'#888':'#555'};
            --dx:${Math.cos(angle)*dist}px;
            --dy:${Math.sin(angle)*dist - 40}px;
            --rot:${Math.random()*720}deg;
            animation-duration:${1.0 + Math.random()*0.5}s;
          `;
          layer.appendChild(p);
        }

        // ── Smoke puffs (dark, slower) ──
        for (let i = 0; i < 10; i++) {
          const p = document.createElement('div');
          p.className = 'exfireball';
          const ox = (Math.random()-0.5)*60;
          const oy = (Math.random()-0.5)*60 - 20;
          const s  = 30 + Math.random()*40;
          p.style.cssText = `
            left:${cx+ox-s/2}px; top:${cy+oy-s/2}px;
            width:${s}px; height:${s}px;
            background:radial-gradient(circle,rgba(40,30,20,.7) 0%,rgba(20,15,10,.4) 50%,transparent 100%);
            animation-duration:${1.0+Math.random()*0.6}s;
            animation-delay:${0.1+Math.random()*0.3}s;
          `;
          layer.appendChild(p);
        }

        // ── Vibrate device ──
        if (navigator.vibrate) navigator.vibrate([80,30,120,30,200]);

        setTimeout(() => {
          layer.innerHTML = '';
          bd.style.transform = '';
          bd.style.filter = 'drop-shadow(4px 8px 10px rgba(0,0,0,.8))';
          document.getElementById('bd-svg').style.animation = '';
          if (onDone) onDone();
        }, 2000);
      }, 60);
    }
  }, 55);
}

// ─── PATCH: music hooks ─────────────────────────────────────────
// Music starts with each new order
// Wrap addToPlate to play sfx
const _origAdd = addToPlate;
window.addToPlate = function(id) {
  const before = G.plateIds.length;
  _origAdd(id);
  if (G.plateIds.length > before) {
    sfxAdd();
    // Show "No freebies!" toast if item wasn't on the order
    if (!G.needed.includes(id)) {
      const card = document.getElementById('ic-' + id);
      if (card) {
        const rect = card.getBoundingClientRect();
        const wrap = document.getElementById('app').getBoundingClientRect();
        const toast = document.createElement('div');
        toast.className = 'freebie-toast';
        toast.textContent = 'NO FREEBIES! -$' + ((INGREDIENT_PRICES[id] || 0).toFixed(2));
        toast.style.left = (rect.left - wrap.left + rect.width/2 - 60) + 'px';
        toast.style.top  = (rect.top  - wrap.top  - 10) + 'px';
        document.getElementById('app').appendChild(toast);
        setTimeout(() => toast.remove(), 950);
      }
    }
  }
};

// Wrap serveOrder to play sfx
const _origServe = serveOrder;
window.serveOrder = function() {
  stopMusic();
  const payout  = computePayout();
  const freePen = parseFloat(computeFrebiePenalty().toFixed(2));
  const final   = parseFloat(Math.max(0, payout - freePen).toFixed(2));
  if (payout === 0) {
    // Comped — explode first then show result
    clearInterval(G.timerInt);
    G.money = parseFloat((G.money + 0).toFixed(2));
    updateHUD();
    triggerExplosion(() => {
      document.getElementById('bd-svg').style.opacity = '1';
      showResult(0, 0, 0);
    });
  } else {
    sfxServe();
    if (final >= (G.currentOrder ? G.currentOrder.totalPrice * 0.99 : 0)) sfxWin();
    _origServe();
  }
};

// Wrap startGame to stop music and reset
const _origStart = startGame;
window.startGame = function() {
  stopMusic();
  document.getElementById('explosion-layer').innerHTML = '';
  const bdSvg = document.getElementById('bd-svg');
  bdSvg.style.opacity = '1';
  bdSvg.style.animation = '';
  _origStart();
};

// Patch timer late warnings to play sfx
const _origStartTimer = startTimer;
window.startTimer = function(secs) {
  clearInterval(G.timerInt);
  G.timeLeft = secs;
  G.baseTime = secs;
  updateTimerUI();
  G.timerInt = setInterval(() => {
    G.timeLeft--;
    updateTimerUI();
    if (G.timeLeft <= 10) document.getElementById('app').classList.add('show-hints');
    if (G.timeLeft <= 5 && G.timeLeft > 0) {
      sfxLate();
      bdSay('late');
      bdAnim('angry');
    }
    // Explode exactly when timer hits 0
    if (G.timeLeft <= 0 && G.phase !== 'exploding') {
      clearInterval(G.timerInt);
      G.phase = 'exploding';
      updateHUD();
      stopMusic();
      triggerExplosion(() => {
        document.getElementById('bd-svg').style.opacity = '1';
        showResult(0, 0, 0);
      });
    }
  }, 1000);
};

// Patch nextOrder to restart music
const _origNextOrder = nextOrder;
window.nextOrder = function() {
  hideOverlay();
  beginOrder();
};

// Patch cashOut to stop music
const _origCashOut = cashOut;
window.cashOut = function() {
  stopMusic();
  _origCashOut();
};

// Auto-start music on first user interaction
document.getElementById('app').addEventListener('click', () => {
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}, { once: false });

</script>
